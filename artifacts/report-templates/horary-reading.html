<!doctype html>
<!--
Astrolab horary-v1 reader template. Use docs/horary-reading-recipe.md and
horary-astrology.md. Filled copies and client assets belong under .private/.
Do not fabricate a judgment to fill a section. For defer, render the reason and
next clarification in READING_HTML; omit unsupported outcome/timing sections.

HTML-escape every TEXT/attribute token, including the question:
TITLE_TEXT, QUESTION_TEXT, META_TEXT, FOOTNOTE_TEXT, AUTHOR_MODEL,
AUTHOR_REASONING_EFFORT, INPUT_SHA256, FACTS_SHA256.
SUMMARY_HTML, READING_HTML, FULL_BASIS_HTML are trusted author-generated HTML,
not raw client content. WHEEL_HTML is the shared renderer's trusted inline SVG
with a viewBox, role="img" and a readable aria-label. Embed all assets; no external
fonts or scripts. Remove the renderer's export heading in the presentation copy,
preserving the raw file. Do not rasterize small chart labels.

Keep the question and direct answer first. READING_HTML normally explains why,
the course/conditions and timing where supported. Its section count is flexible.
Use <section class="section" id="unique-id"><h2>…</h2>…</section>.
FULL_BASIS_HTML includes both intake decisions, roles, directed receptions,
ordered events, states/phases, alternative reading, method/sources and hashes.
Wrap wide tables in <div class="table-scroll" tabindex="0" aria-label="…">.
Replace every token. Do not place internal process notes in the reader's prose.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="astrolab-method" content="horary-v1">
<meta name="astrolab-author-model" content="{{AUTHOR_MODEL}}">
<meta name="astrolab-author-reasoning-effort" content="{{AUTHOR_REASONING_EFFORT}}">
<meta name="astrolab-input-sha256" content="{{INPUT_SHA256}}">
<meta name="astrolab-facts-sha256" content="{{FACTS_SHA256}}">
<title>{{TITLE_TEXT}} · Astrolab</title>
<style>
:root{color-scheme:light;--ink:#1e2e46;--blue:#174b8d;--muted:#53677d;--line:#b0c6df}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:18px/1.7 Georgia,'Times New Roman',serif;overflow-wrap:break-word}
main{max-width:1100px;margin:auto;padding:44px 40px 70px}
a{color:var(--blue);text-underline-offset:4px}
a:focus-visible,summary:focus-visible,.table-scroll:focus-visible{outline:2px solid var(--blue);outline-offset:5px}
.brand,.meta,summary,table,.foot{font-family:'Segoe UI',Arial,sans-serif}
.brand{color:var(--blue);font-size:13px;font-weight:600;letter-spacing:.14em}
h1{font-size:clamp(35px,5.2vw,58px);font-weight:400;line-height:1.12;letter-spacing:-.035em;max-width:850px;margin:22px 0}
h2{font-size:clamp(28px,3.4vw,38px);font-weight:400;line-height:1.2;letter-spacing:-.025em;margin:0 0 23px}
h3{font-size:22px;line-height:1.35;font-weight:400;color:var(--blue);margin:29px 0 12px}
p{margin:0 0 17px;orphans:3;widows:3}
.meta{color:var(--muted);font-size:13px;margin-bottom:27px}
.summary{max-width:790px;font-size:22px;line-height:1.6}
.reading{max-width:790px}
.section{position:relative;margin-top:64px;padding-top:43px;scroll-margin-top:23px}
.section::before{content:'✦';position:absolute;z-index:1;top:0;left:0;display:block;width:112px;height:14px;color:var(--blue);text-align:center;font:18px/14px Georgia,serif;background:linear-gradient(white,white) center/24px 100% no-repeat}
.section::after{content:'';position:absolute;top:7px;left:0;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.wheel{max-width:780px;margin:0 auto}
.wheel svg{display:block;width:100%;height:auto}
summary{cursor:pointer;color:var(--blue);font-size:17px;line-height:1.5;padding:8px 0}
.appendix{font-size:15px;line-height:1.7;max-width:900px}
.appendix-content{padding-top:22px}
table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.55;margin:19px 0}
th{text-align:left;color:var(--muted);font-weight:400;padding:0 18px 13px 0}
td{vertical-align:top;padding:10px 18px 10px 0}
th:last-child,td:last-child{padding-right:0}
.table-scroll{max-width:100%;overflow-x:auto}
.foot{margin-top:47px;color:var(--muted);font-size:12px;line-height:1.6;max-width:790px}
@media(max-width:760px){main{padding:27px 22px 45px}body{font-size:17px}.summary{font-size:20px}.section{margin-top:49px;padding-top:36px}table{font-size:12px}th,td{padding-right:12px}}
@media print{main{padding:10mm;max-width:none}body{font-size:11pt}.summary{font-size:13pt}h1{font-size:30pt}h2{font-size:23pt}h2,h3{break-after:avoid}figure,tr{break-inside:avoid}.section{margin-top:12mm;padding-top:9mm}a{color:inherit}summary{font-size:12pt}.foot{font-size:8pt}.table-scroll{overflow:visible}details:not([open]){display:none}}
</style>
</head>
<body>
<main id="top">
<header>
<div class="brand">ASTROLAB · ХОРАР</div>
<h1>{{QUESTION_TEXT}}</h1>
<div class="meta">{{META_TEXT}}</div>
<div class="summary">{{SUMMARY_HTML}}</div>
</header>
<div class="reading">{{READING_HTML}}</div>
<section class="section" aria-labelledby="chart-title">
<h2 id="chart-title">Карта вопроса</h2>
<figure class="wheel">{{WHEEL_HTML}}</figure>
</section>
<section class="section" aria-label="Основание ответа">
<details class="appendix">
<summary>На чём основан ответ</summary>
<div class="appendix-content">{{FULL_BASIS_HTML}}</div>
</details>
</section>
<footer class="foot">{{FOOTNOTE_TEXT}}</footer>
</main>
</body>
</html>
