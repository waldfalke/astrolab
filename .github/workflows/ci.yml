name: public-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.19"

      - name: Clone the candidate from Git
        run: |
          set -euo pipefail
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/public-clone"
          git -C "$RUNNER_TEMP/public-clone" fetch "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/public-clone" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/public-clone" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check public surface in fresh clone
        working-directory: ${{ runner.temp }}/public-clone
        run: python tools/check_public_surface.py

      - name: Scan current source for secrets
        run: >-
          docker run --rm
          --mount "type=bind,source=$RUNNER_TEMP/public-clone,target=/repo,readonly"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --no-banner --redact=100 /repo

      - name: Install
        working-directory: ${{ runner.temp }}/public-clone
        run: uv sync --frozen --group engine-a

      - name: Fetch verified ephemeris
        working-directory: ${{ runner.temp }}/public-clone
        run: pwsh infra/ephe/get-ephe.ps1 -Source web

      - name: Test autonomous engine
        working-directory: ${{ runner.temp }}/public-clone
        env:
          SWISS_ENGINE: a
          SWISS_EPHE_PATH: infra/ephe/files
          REQUIRE_ENGINE_A: "1"
        run: uv run pytest -m "not needs_swiss_mcp" -q

      - name: Build image
        working-directory: ${{ runner.temp }}/public-clone
        run: docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" -t astrolab:ci .

      - name: Verify image revision
        run: >-
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' astrolab:ci)"
          = "$GITHUB_SHA"

      - name: Start image on localhost
        run: |
          docker run --detach \
            --cidfile "$RUNNER_TEMP/astrolab.cid" \
            --publish 127.0.0.1:18400:8400 \
            astrolab:ci

      - name: Wait for container health
        run: |
          set -euo pipefail
          cid="$(cat "$RUNNER_TEMP/astrolab.cid")"
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            case "$status" in
              healthy)
                exit 0
                ;;
              unhealthy)
                echo "container became unhealthy" >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "container did not become healthy within 90 seconds" >&2
          exit 1

      - name: Verify runtime hardening
        run: |
          set -euo pipefail
          cid="$(cat "$RUNNER_TEMP/astrolab.cid")"
          test "$(docker exec "$cid" id -u)" = "10001"
          test "$(docker exec "$cid" id -g)" = "10001"
          for binary in uv gcc g++ make; do
            if docker exec "$cid" sh -c "command -v '$binary' >/dev/null 2>&1"; then
              echo "unexpected runtime binary: $binary" >&2
              exit 1
            fi
          done

      - name: Call MCP over HTTP
        working-directory: ${{ runner.temp }}/public-clone
        run: |
          set -euo pipefail
          for example in rising_hands natal chart_workflow invalid_input; do
            uv run python examples/call_mcp.py "$example" \
              --url http://127.0.0.1:18400/mcp
          done

      - name: Build release archive and checksum
        working-directory: ${{ runner.temp }}/public-clone
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/astrolab-public-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --output "$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: astrolab-public-${{ github.sha }}
          path: |
            ${{ runner.temp }}/astrolab-public-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/astrolab-public-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error

      - name: Show container logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/astrolab.cid" ]; then
            docker logs "$(cat "$RUNNER_TEMP/astrolab.cid")" || true
          fi

      - name: Remove container
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/astrolab.cid" ]; then
            docker rm --force "$(cat "$RUNNER_TEMP/astrolab.cid")" || true
          fi
